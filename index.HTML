
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Image classification Game</title>

    <link rel="stylesheet" href="./static/style.css">
    <script src="./static/script.js" defer></script>
</head>
<body>
    <header> 
        <h1>AI Image classification Game</h1>
    </header>

    <main>
        <section>
            <h2>Guess what the AI sees!</h2>

            <p> 
                Paint over the areas you believe are most important to the AI's prediction.
            </p>
            
            <div class="images">
                <canvas id="imageCanvas"></canvas>
                <img id="imageHeatmap" hidden>
            </div>

            <p id="similarityScore"> </p>

            <div class="controlls">
                <button id="clearButton">Clear</button>
                <button id="submitButton">Submit</button>
                <button id="nextButton" hidden>Next</button>
            </div>
        </section>
    </main>

    <footer>

    </footer>
</body>
</html>
